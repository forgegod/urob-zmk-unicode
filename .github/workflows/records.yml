name: Record check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  records:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-product-records.mjs
      - run: node --test tests/records-evidence.test.mjs
